<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer border -->
  <rect width="100" height="100" fill="#ffffff" rx="12" />
  <rect x="2" y="2" width="96" height="96" fill="none" stroke="#e4e4e7" stroke-width="2" rx="10" />

  <!-- Top-left positioning box -->
  <rect x="10" y="10" width="20" height="20" fill="none" stroke="#18181b" stroke-width="4" />
  <rect x="15" y="15" width="10" height="10" fill="#18181b" />

  <!-- Top-right positioning box -->
  <rect x="70" y="10" width="20" height="20" fill="none" stroke="#18181b" stroke-width="4" />
  <rect x="75" y="15" width="10" height="10" fill="#18181b" />

  <!-- Bottom-left positioning box -->
  <rect x="10" y="70" width="20" height="20" fill="none" stroke="#18181b" stroke-width="4" />
  <rect x="15" y="75" width="10" height="10" fill="#18181b" />

  <!-- Small alignment box -->
  <rect x="65" y="65" width="10" height="10" fill="none" stroke="#18181b" stroke-width="2" />
  <rect x="69" y="69" width="2" height="2" fill="#18181b" />

