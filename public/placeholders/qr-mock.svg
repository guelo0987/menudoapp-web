  <rect x="65" y="35" width="5" height="10" fill="#18181b" />
  <rect x="75" y="35" width="15" height="5" fill="#18181b" />

  <rect x="15" y="50" width="10" height="5" fill="#18181b" />
  <rect x="30" y="45" width="5" height="15" fill="#18181b" />
  <rect x="40" y="50" width="20" height="5" fill="#18181b" />
