  <rect x="75" y="60" width="15" height="5" fill="#18181b" />

  <rect x="35" y="70" width="5" height="15" fill="#18181b" />
  <rect x="45" y="75" width="15" height="5" fill="#18181b" />
  <rect x="80" y="70" width="10" height="5" fill="#18181b" />

  <rect x="35" y="80" width="10" height="5" fill="#18181b" />
