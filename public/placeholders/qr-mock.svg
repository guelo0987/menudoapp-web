  <rect x="65" y="20" width="10" height="5" fill="#18181b" />

  <rect x="10" y="35" width="5" height="10" fill="#18181b" />
  <rect x="20" y="40" width="10" height="5" fill="#18181b" />
  <rect x="35" y="35" width="5" height="5" fill="#18181b" />
